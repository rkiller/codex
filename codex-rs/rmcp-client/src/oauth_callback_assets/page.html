<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{title} · {brand_name}</title>
{refresh}
<style>{style}</style>
</head>
<body class="{state_class}">
<main class="shell">
<header class="brand"><span class="brand-name">{brand_name}</span><span class="brand-caption">ACCOUNT CONNECTION</span></header>
<section class="card" aria-labelledby="status-title">
<div class="artwork">{artwork}<span class="art-caption">A secure connection.<br>A simpler day.</span></div>
<div class="content">
<span class="status"><span class="status-dot" aria-hidden="true"></span>{status_label}</span>
<h1 id="status-title">{title}</h1>
<p class="message">{message}</p>
<div class="next-step"><span class="step-mark" aria-hidden="true">{step_mark}</span><p>{next_step}</p></div>
</div>
</section>
<footer><span class="footer-dot" aria-hidden="true"></span>Private by design<span class="footer-divider" aria-hidden="true">·</span>Secure sign-in with Codex</footer>
</main>
</body>
</html>
